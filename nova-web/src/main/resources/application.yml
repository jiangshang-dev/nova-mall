server:
  port: 8082
  servlet:
    context-path: /
spring:
  application:
    name: nova-mall
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
nova-mall:
  security:
    jwt-secret: nova-mall-jwt-secret-key-32bytes!!
    token-name: Access-Token
    expire: 604800000
  mq:
    enabled: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
